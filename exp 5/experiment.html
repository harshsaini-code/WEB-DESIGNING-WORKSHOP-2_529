<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>  

    <div class="header">
        <h1>Employee Salary Management</h1>
    </div>

    <div class="content">
        <input type="text" id="name" placeholder="Enter Name">
        <input type="text" id="empid" placeholder="Enter ID">
        <input type="number" id="salary" placeholder="Enter salary">
        <input type="text" id="dept" placeholder="Enter dept">
        <br>
        <br>

        <button type="button" onclick="addEmp()">Add Employee</button>
        <button type="button" onclick="dis()">Display All</button>
        <button type="button" onclick="sal50k()">Salary > 30000</button>
        <button type="button" onclick="totSal()">Total Salary</button>
        <button type="button" onclick="empCount()">Employee in DEPT.</button>
        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
