<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body id = "mota">

    <div class="content" id="box">
        <h1 id="heading">Use of JavaScript</h1>

        <input type="text" id="inputBox" placeholder="Enter something">
        <br><br>

        <button onclick="changeBackground()">Change Background</button>
        <button onclick="changeHeading()">Change Heading</button>
        <button onclick="increaseFont()">Increase Font Size</button>
        <button onclick="togglePara()">Hide/Show Paragraph</button>
        <button onclick="resetPage()">Reset</button>

        <p id="para">This is a sample paragraph. You can hide or show me!</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
