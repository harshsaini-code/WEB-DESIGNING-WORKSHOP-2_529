<!DOCTYPE html>
<html>
<head>
    <title>Report Card</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        table {
            border-collapse: collapse;
            width: 60%;
            text-align: center;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        th {
            background-color: #4CAF50;
            color: white;
            padding: 10px;
        }

        td {
            padding: 8px;
        }

        tr:nth-child(even) {
            background-color: #e8f5e9;
        }

        tr:hover {
            background-color: #c8e6c9;
        }

        th, td {
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

<table>
    <tr>
        <th>Name</th>
        <th>Maths</th>
        <th>Science</th>
        <th>English</th>
        <th>Computer</th>
    </tr>
    <tr>
        <td>Rahul</td>
        <td>85</td>
        <td>90</td>
        <td>78</td>
        <td>88</td>
    </tr>
    <tr>
        <td>Anjali</td>
        <td>92</td>
        <td>89</td>
        <td>84</td>
        <td>95</td>
    </tr>
</table>

</body>
</html>
